name: Guide integrity

# The rating guide's meaning can't change without a new GUIDE_VERSION and changelog entry,
# and the English pages must match the Arabic source. See tools/guide_check.py.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guide text, version, labels and changelog agree
        run: python tools/guide_check.py
      - name: English pages are in sync with the Arabic source
        run: python tools/i18n/build_en.py --check
