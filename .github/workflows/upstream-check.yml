name: Upstream health

# Every 6 hours (and on demand from the Actions tab): checks every outside service the site
# depends on, directly and through muhafid.com (tools/upstream_check.py). A failed run means
# a source or an endpoint is down — GitHub emails the repo owner. Read-only; ~25 requests.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check AniList, Jikan, TMDB, RAWG, Open Library, HLTB, translate, image proxy
        run: python tools/upstream_check.py https://muhafid.com
